name: Unlighthouse Site Audit

# 触发条件：每次 push 到 main 分支时运行，也可以手动触发
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    # 每周一早上 8 点（UTC 0 点）自动跑一次，及时发现问题
    - cron: '0 0 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Unlighthouse
        run: |
          npx unlighthouse-ci \
            --site https://titansportgear.com \
            --reporter jsonExpanded \
            --build-static \
            --outputPath .unlighthouse

      # 调试用：把当前目录结构打印出来，方便确认报告实际生成在哪里
      - name: Debug - list generated files
        if: always()
        run: |
          echo "===== 当前目录内容 ====="
          ls -la
          echo "===== .unlighthouse 目录内部结构（递归） ====="
          find .unlighthouse -type f 2>&1 || echo ".unlighthouse 目录不存在或读取失败"
          echo "===== .unlighthouse 目录树 ====="
          find .unlighthouse 2>&1 || true

      # 把生成的报告作为 Artifact 上传，方便在 Actions 页面下载查看
      # if-no-files-found: warn 让这一步即使没找到文件也不会让整个 workflow 失败
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unlighthouse-report
          path: .unlighthouse
          retention-days: 30
          if-no-files-found: warn
