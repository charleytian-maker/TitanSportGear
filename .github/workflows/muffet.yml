name: Broken Link Check (muffet)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1'

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Run muffet against live site
        run: |
          docker run --rm raviqqe/muffet:latest \
            https://titansportgear.com \
            --timeout=10 \
            --max-connections=5 \
            --buffer-size=8192 \
            2>&1 | tee muffet-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muffet-report
          path: muffet-report.txt
          retention-days: 30
