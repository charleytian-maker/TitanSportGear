<!doctype html>
<html lang="en">
<head>
<link rel="canonical" href="https://www.titansportgear.com/admin.html" />
<meta name="description" content="Privacy Policy for B2B wholesale, OEM and ODM cooperation with Titan Sport Gear.">
<meta charset="utf-8">
<title>Create New Article</title>
<style>
body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
label { display: block; margin-top: 15px; font-weight: bold; }
input, textarea, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
textarea { height: 200px; }
button { margin-top: 20px; padding: 10px 20px; font-size: 16px; }
#msg { margin-top: 15px; font-weight: bold; }
</style>
</head>
<body>
<h1>Create New Article</h1>

<label>Password</label>
<input type="password" id="password">

<label>Language</label>
<select id="lang">
  <option value="en">English (en)</option>
  <option value="de">German (de)</option>
</select>

<label>Title</label>
<input type="text" id="title">

<label>Slug (URL-friendly name, e.g. pickle-ball-guide, no space)</label>
<input type="text" id="slug">

<label>Excerpt (short summary for listing page)</label>
<input type="text" id="excerpt">

<label>Content (line breaks will convert to paragraph tags automatically)</label>
<textarea id="content"></textarea>

<input type="file" id="mediaFile" accept="image/*,video/*">
<button onclick="uploadMedia()">上传</button>


<button onclick="submitPost()">Publish</button>
<div id="msg"></div>
<hr style="margin-top:40px;">
<h2>Manage Posts</h2>
<div id="postList">Loading posts...</div>

<script>
async function loadPostList() {
  const listDiv = document.getElementById('postList');
  listDiv.innerHTML = 'Loading posts...';

  const langs = ['en', 'de'];
  let allPosts = [];

  for (const lang of langs) {
    const res = await fetch('/api/posts?lang=' + lang);
    const posts = await res.json();
    allPosts = allPosts.concat(posts);
  }

  if (allPosts.length === 0) {
    listDiv.innerHTML = '<p>No posts yet.</p >';
    return;
  }

  listDiv.innerHTML = allPosts.map(p => `
    <div style="padding:8px 0; border-bottom:1px solid #ddd;">
      <strong>${p.title}</strong> [${p.lang}] (${p.slug})
      <button onclick="deletePost('${p.slug}', '${p.lang}')" style="margin-left:10px; color:red;">删除</button>
    </div>
  `).join('');
}

async function deletePost(slug, lang) {
  const password = document.getElementById('password').value.trim();
  if (!confirm('确定要删除文章 "' + slug + '" [' + lang + '] 吗?')) return;

  const res = await fetch('/api/delete-post', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ slug, lang, password })
  });
  const data = await res.json();
  if (data.success) {
    alert('删除成功');
    loadPostList();
  } else {
    alert('删除失败: ' + (data.error || '未知错误'));
  }
}

// 页面加载时自动拉取文章列表
loadPostList();
let uploadedImageUrl = '';
async function uploadMedia() {
  const fileInput = document.getElementById('mediaFile');
  const file = fileInput.files[0];
  if (!file) {
    document.getElementById('msg').innerText = '请先选择文件';
    return;
  }
  const fd = new FormData();
  fd.append('file', file);

  document.getElementById('msg').innerText = '上传中...';
  const res = await fetch('/api/upload', { method: 'POST', body: fd });
  const data = await res.json();

  if (data.url) {
    uploadedImageUrl = data.url;
    document.getElementById('msg').innerText = '上传成功：' + data.url;
} else {
    document.getElementById('msg').innerText = '上传失败：' + (data.error || '未知错误');
  }
}

function submitPost() {
  const title = document.getElementById('title').value.trim();
  const slug = document.getElementById('slug').value.trim();
  const excerpt = document.getElementById('excerpt').value.trim();
  const lang = document.getElementById('lang').value;
  let content = document.getElementById('content').value.trim();
  content = content.replace(/[""]/g, '"').replace(/['']/g, "'"); 
  const password = document.getElementById('password').value.trim();
  

  // Convert line breaks to <p> tags
  content = content.split('\n').map(p => `<p>${p.trim()}</p >`).join('');

  const msg = document.getElementById('msg');
  if (!title || !slug || !content) {
    msg.textContent = 'Title, Slug and Content are required.';
    return;
  }

  msg.textContent = 'Publishing...';
  msg.style.color = 'black';

  fetch('/api/create-post', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, slug, content, excerpt, lang, password, image: uploadedImageUrl })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      uploadedImageUrl = '';
      msg.textContent = 'Publishing successful!';
      msg.style.color = 'green';
      document.getElementById('title').value = '';
      document.getElementById('slug').value = '';
      document.getElementById('excerpt').value = '';
      document.getElementById('content').value = '';
    } else {
      msg.textContent = 'Failed: ' + (data.error || 'Unknown error');
      msg.style.color = 'red';
    }
  })
  .catch(err => {
    msg.textContent = 'Request failed: ' + err;
    msg.style.color = 'red';
  });
}
</script>
</body>
</html>
