<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blog - TitanSportGear</title>
  <link rel="canonical" href="https://titansportgear.com/blog/">
  <meta name="description" content="Tips, guides and product insights from TitanSportGear.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../default.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KW760Q6V16"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-KW760Q6V16');

<body>
<div id="header-placeholder"></div>
  <script src="../load-header.js"></script>
  <script src="../script.js"></script>
  <div id="page" class="container">
    <div id="content" style="padding-top:40px;">
      <div class="title">
        <h2>Blog</h2>
        <span class="byline">Guides, tips and product news</span>
      </div>

 <div class="blog-list" id="blog-list">Loading...</div>

<script>
fetch('/api/posts')
  .then(res => res.json())
  .then(posts => {
    const list = document.getElementById('blog-list');
    list.innerHTML = posts.map(post => `
      <div class="blog-card">
        <a href="post.html?slug=${post.slug}">
          <h3>${post.title}</h3>
        </a >
        <p class="blog-date">${post.published_at}</p >
        <p>${post.excerpt}</p >
        <a href="post.html?slug=${post.slug}">Read more &raquo;</a >
      </div>
    `).join('');
  });
</script>
    </div>
  </div>
<div id="footer-placeholder"></div>
<script src="../load-footer.js"></script>

</body>
</html>
