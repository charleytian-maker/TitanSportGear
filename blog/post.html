<!doctype html>
<html lang="en">
<head>
<link rel="canonical" href="https://www.titansportgear.com/de/blog/post/" />
<link rel="alternate" hreflang="en" href="https://titansportgear.com/blog/post">
<link rel="alternate" hreflang="de" href="https://titansportgear.com/de/blog/post">
<link rel="alternate" hreflang="x-default" href="https://titansportgear.com/blog/post">
<meta name="description" content="Privacy Policy for B2B wholesale, OEM and ODM cooperation with Titan Sport Gear.">
<meta charset="utf-8">
<title id="page-title">Blog</title>
<link rel="stylesheet" href="/default.css">
<style>
    .blog-post img,
    .blog-post video {
      max-width: 300px;
      height: auto;
      display: block;
      margin: 20px auto;
    }
    .title {
      margin-top: 40px !important; 
    }
  </style>
</head>
<body>
<div id="header-placeholder"></div>
<script src="/load-header.js"></script>
<script src="/script.js"></script>
<div id="page" class="container">
  <div id="content">
    <div class="title">
      <h2 id="post-title">Loading...</h2>
      <span class="byline" id="post-date"></span>
    </div>
    <article class="blog-post" id="post-content"></article>
    <p><a href="/blog/index.html">&laquo; Back to Blog</a ></p >
  </div>
</div>

<div id="footer-placeholder"></div>
<script src="/load-footer.js"></script>

<script>
function fixLangLinks(){
  let deLink = document.querySelector('#lang-de');
  let enLink = document.querySelector('#lang-en');
  if(deLink && enLink){
    deLink.href = "/de/blog/post";
    enLink.href = "/blog/post";
    return;
  }
  setTimeout(fixLangLinks,80);
}
fixLangLinks();
const slug = new URLSearchParams(window.location.search).get('slug');
fetch('/api/post?slug=' + encodeURIComponent(slug))
  .then(res => res.json())
  .then(post => {
    if (post.error) {
      document.getElementById('post-title').textContent = 'Post not found';
      return;
    }
    document.title = post.title;
    document.getElementById('page-title').textContent = post.title;
    document.getElementById('post-title').textContent = post.title;
    document.getElementById('post-date').textContent = 'Published ' + post.published_at;
    document.getElementById('post-content').innerHTML = post.content;
    let metaDesc = document.querySelector('meta[name="description"]');
if(!metaDesc){
  metaDesc = document.createElement('meta');
  metaDesc.name="description";
  document.head.appendChild(metaDesc);
}
  metaDesc.content = post.excerpt || "";
  const deBtn = document.querySelector('#lang-de');
  const enBtn = document.querySelector('#lang-en');
  if(deBtn) deBtn.href = `/de/blog/post?slug=${slug}`;
  if(enBtn) enBtn.href = `/blog/post?slug=${slug}`;
  document.querySelector('link[hreflang="de"]').href = `/de/blog/post?slug=${slug}`;
  document.querySelector('link[hreflang="en"]').href = `/blog/post?slug=${slug}`;
  document.querySelector('link[hreflang="x-default"]').href = `/blog/post?slug=${slug}`;

  });
</script>
</body>
</html>
