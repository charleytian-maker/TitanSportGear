<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO Title: 包含核心长尾词，控制在60字符以内 -->
    <title>Profi Basketbälle & Sportausrüstung kaufen | Premium Qualität</title>
    <!-- Meta Description: 吸引点击，包含核心关键词，控制在150字符以内 -->
    <meta name="description" content="Suchen Sie den besten Outdoor-Basketball? Entdecken Sie unsere Premium-Basketbälle für Indoor & Outdoor. Robust, langlebig und perfekt für Ihr Training!">
    <!-- Meta Keywords: 虽然Google不看重，但对部分欧洲小引擎有益 -->
    <meta name="keywords" content="basketball kaufen, profi basketball outdoor, basketball größe 7, sportausrüstung shop, langlebiger basketball">
    
    <style>
        /* 保持您原本的样式，仅作为骨架参考 */
        .product-grid { display: flex; flex-wrap: wrap; gap: 15px; }
        .product-grid img { width: 200px; height: auto; cursor: pointer; border-radius: 8px; transition: transform 0.2s; }
        .product-grid img:hover { transform: scale(1.05); }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background:#fff; padding:20px; border-radius:8px; max-width:500px; text-align:center; position:relative; }
        .close-btn { position:absolute; right:15px; top:10px; font-size:24px; cursor:pointer; }
        .modal-desc { margin-top:15px; text-align:left; white-space: pre-line; font-family: sans-serif; }
    </style>
</head>
<body>

    <!-- SEO 优化：添加 H1 标题，明确网页核心主题（对 Google 极为关键） -->
    <header style="padding: 20px; text-align: center;">
        <h1>Premium Basketbälle & Profi-Sportausrüstung</h1>
        <p>Entdecken Sie unsere Auswahl an erstklassigen Basketbällen für Training und Wettkampf.</p >
    </header>

    <main>
        <!-- 移除了行内 onclick 和重复属性，改用标准的 data- 属性存储 SEO 长尾词描述 -->
        <div class="product-grid" id="productGrid">
            
            <!-- Pickleball Set (保留并本土化) -->
            <img src="images/LBB-015.jpg" 
                 alt="Profi Pickleball Set T700 Kohlefaser LBB-015" 
                 data-title="Profi Pickleball Set - LBB-015"
                 data-desc="Dieses professionelle Pickleball-Set wurde speziell für fortgeschrittene Spieler entwickelt. Hergestellt aus hochwertiger T700 Kohlefaser für maximale Kontrolle, extreme Langlebigkeit und perfekten Spin auf dem Platz. Ideal für Turniere und intensives Training.">
            
            <!-- Basketball 产品 41-50：每个产品均使用了不同的、符合 Google 搜索习惯的德语长尾关键词描述 -->
            <img src="images/ball25.jpg" 
                 alt="Profi Outdoor Basketball Größe 7" 
                 data-title="Profi Outdoor Basketball (Größe 7)"
                 data-desc="Suchen Sie den besten Basketball für den Freiplatz? Dieser Profi Outdoor-Basketball in offizieller Größe 7 bietet extremen Grip auf Asphalt und Freiplätzen. Perfekt für Streetball und intensives Wurftraining.">

            <img src="images/ball25.jpg" 
                 alt="Indoor Basketball aus Premium-Leder" 
                 data-title="Premium Indoor Leder-Basketball"
                 data-desc="Hochwertiger Hallen-Basketball aus griffigem Composite-Leder. Dieser Ball bietet hervorragende KONTROLLE und optimales Sprungverhalten auf Hallenböden. Die erste Wahl für Vereine und Turnierspieler.">

            <img src="images/ball25.jpg" 
                 alt="Langlebiger Streetball Basketball für Asphalt" 
                 data-title="Streetball Basketball - Extra Robust"
                 data-desc="Extrem widerstandsfähiger Gummiball, entwickelt für den harten Einsatz auf Beton und Schulsportplätzen. Abriebfest, langlebig und mit optimalen Flugeigenschaften ausgestattet.">

            <img src="images/ball25.jpg" 
                 alt="Basketball für Kinder und Jugendliche Größe 5" 
                 data-title="Jugend-Basketball (Größe 5)"
                 data-desc="Perfekter Trainingsball für Kinder und Jugendliche. Durch das reduzierte Gewicht und die kleinere Größe 5 lernen junge Talente die richtige Korbwurf-Technik deutlich schneller.">

            <img src="images/ball25.jpg" 
                 alt="Rutschfester Basketball mit tiefen Rillen" 
                 data-title="Grip-Master Basketball"
                 data-desc="Dank der extra tiefen Ballrillen (Deep Channels) garantiert dieser Basketball maximale Ballkontrolle und rutschfesten Halt, selbst bei verschwitzten Händen im intensiven Match.">

            <img src="images/ball25.jpg" 
                 alt="Matchball Basketball für offizielle Turniere" 
                 data-title="Official Matchball Basketball"
                 data-desc="Zugelassener Wettkampfball für den offiziellen Spielbetrieb. Erfüllt alle Kriterien bezüglich Gewicht, Umfang und Luftdruck. Holen Sie sich das echte Profi-Gefühl in Ihre Halle.">

            <img src="images/ball25.jpg" 
                 alt="Allwetter Basketball für Schule und Verein" 
                 data-title="Allwetter-Basketball für Schulen"
                 data-desc="Der ideale Allround-Basketball für den Schulsport. Egal ob Regen oder Sonnenschein, das wetterfeste Material hält jeder Witterung stand und verliert nie seine Form.">

            <img src="images/ball25.jpg" 
                 alt="Basketball Trainingsball für Wurftraining" 
                 data-title="Heavy-Weight Trainingsbasketball"
                 data-desc="Spezieller Trainingsball zur Stärkung der Handgelenks- und Fingermuskulatur. Verbessern Sie Ihre Reichweite und Passgenauigkeit durch gezieltes Training mit diesem Premium-Produkt.">

            <img src="images/ball25.jpg" 
                 alt="Stylischer Basketball schwarz gold Design" 
                 data-title="Design Edition Basketball Black/Gold"
                 data-desc="Ein absoluter Blickfang auf jedem Court. Dieser Basketball kombiniert exzellente Spieleigenschaften mit einem modernen, stylischen Design in Schwarz und Gold. Perfekt auch als Geschenk.">

            <img src="images/ball25.jpg" 
                 alt="Verschleißfester Basketball für Schulsportplätze" 
                 data-title="School-Edition Basketball"
                 data-desc="Kostengünstiger und extrem robuster Basketball im Set oder Einzelkauf. Perfekt abgestimmt auf die hohen Anforderungen im täglichen Schulsport und Vereinstraining.">
        </div>
    </main>

    <!-- 弹窗部分 (Modal) -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            < img id="modalImg" src="" alt="Vergrößerte Produktansicht">
            <div id="modalDescription" class="modal-desc"></div>
        </div>
    </div>

    <script>
        // SEO & 性能优化：使用现代 JS 事件委托，避免在每个 <img> 上写 onclick
        const productGrid = document.getElementById('productGrid');
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const modalDesc = document.getElementById('modalDescription');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // 监听整个网格的点击事件
        productGrid.addEventListener('click', function(e) {
            if (e.target.tagName === 'IMG') {
                const img = e.target;
                modal.style.display = 'flex';
                modalImg.src = img.src;
                
                // 获取 SEO 优化的标题和描述
                const title = img.getAttribute('data-title') || img.alt;
                const desc = img.getAttribute('data-desc') || "Keine Produktbeschreibung verfügbar.";
                
                // 在弹窗中渲染
                modalDesc.innerHTML = `<strong>${title}</strong><br><br>${desc}`;
            }
        });

        // 关闭弹窗
        closeModalBtn.addEventListener('click', () => modal.style.display = 'none');
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.style.display = 'none';
        });
    </script>
</body>
</html>
