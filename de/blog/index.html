<body>
<div id="header-placeholder"></div>
 <script src="../../load-header.js"></script>
 <script src="../../script.js"></script>
  <div id="page" class="container">
    <div id="content" style="padding-top:40px;">
      <div class="title">
        <h2>Blog</h2>
        <span class="byline">Anleitungen, Tipps und Produktneuigkeiten</span>
      </div>

 <div class="blog-list" id="blog-list">Loading...</div>

<script>
fetch('/api/posts?lang=de')
  .then(res => res.json())
  .then(posts => {
    const list = document.getElementById('blog-list');
    list.innerHTML = posts.map(post => `
      <div class="blog-card">
        <a href="post.html?slug=${post.slug}&lang=de">
          <h3>${post.title}</h3>
        </a >
        <p class="blog-date">${post.published_at}</p >
        <p>${post.excerpt}</p >
        <a href="post.html?slug=${post.slug}&lang=de">Weiterlesen &raquo;</a >
      </div>
    `).join('');
  });
</script>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="../../load-footer.js"></script>

</body>
