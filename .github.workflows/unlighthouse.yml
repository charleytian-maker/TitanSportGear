name: Unlighthouse Site Audit

on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Unlighthouse
        run: |
          npx unlighthouse-ci \
            --site https://titansportgear.com \
            --reporter jsonExpanded \
            --build-static

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: unlighthouse-report
          path: .unlighthouse
          retention-days: 30
